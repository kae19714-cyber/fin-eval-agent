# Паспорт инициативы: ex-ante допущения, на которых инициатива была одобрена в пилот.
# Все суммы в рублях, ставки — доли.
id: cashback_pilot
name: "Повышенный кэшбэк в категориях партнёров для держателей дебетовых карт"
owner: "Розничный бизнес, дирекция карточных продуктов"
description: >
  Клиент подключает опцию и получает +1 п.п. кэшбэка в категориях партнёров.
  Половину дополнительного кэшбэка компенсируют партнёры. Ожидаемый эффект —
  рост оборота по карте и остатков на счёте (клиент делает банк основным).

pilot:
  start_month: 202601
  data_dir: data/raw          # сырые таблицы пилота (см. fineval/data_gen.py)

economics:                    # ставки, по которым считается доход банка
  interchange_rate: 0.012
  ftp_spread: 0.05            # годовой трансфертный спред на остатки
  base_cashback_rate: 0.010

plan_assumptions:             # бизнес-кейс до пилота
  take_up: 0.45
  spend_uplift: 0.20
  balance_uplift: 0.35
  category_share_shift: 0.05
  extra_cashback_rate: 0.010
  partner_share: 0.50

rollout:                      # масштабирование на всю сеть
  horizon_years: 5
  eligible_clients: [1_500_000, 3_500_000, 5_000_000, 5_000_000, 5_000_000]
  effect_decay_per_year: 0.10 # эффект новизны затухает

costs:
  capex: 450_000_000          # доработка процессинга, мобильного приложения, партнёрского шлюза
  depreciation_years: 5
  opex_per_year: 140_000_000  # сопровождение, партнёрский менеджмент
  marketing_per_year: [180_000_000, 120_000_000, 60_000_000, 60_000_000, 60_000_000]

finance:
  discount_rate: 0.20         # ставка дисконтирования для розничных инициатив (WACC + премия)
  tax_rate: 0.25              # налог на прибыль РФ с 2025 г.

uncertainty:                  # диапазоны для Monte Carlo (множители к базовым значениям)
  capex: [0.9, 1.0, 1.4]      # треугольное: min, mode, max — перерасход вероятнее экономии
  opex: [0.9, 1.0, 1.2]
  eligible_clients: [0.8, 1.0, 1.1]
  effect_decay_per_year: [0.0, 0.10, 0.25]
  plan_effect_cv: 0.35        # для плана: коэффициент вариации эффекта (экспертная оценка)
